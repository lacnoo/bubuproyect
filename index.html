
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lnst@gram — Crear cuenta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root {
  color-scheme: dark;
  --bg-left: #0a0c10;
  --bg-right: #1a1a1c;
  --line: #3d3d43;
  --fg: #f5f5f7;
  --muted: #a9a9b3;
  --pink: #ff5fa2;
  --pink-deep: #e0337f;
  --pink-soft: #ff9ccb;
  --btn-off: #4a1f37;
  --font-display: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Figtree", system-ui, sans-serif;
}

* { box-sizing: border-box; }

html, body { min-height: 100%; }

body {
  margin: 0;
  background: var(--bg-right);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.5;
}

.page {
  min-height: 100vh;
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
}

.left {
  background: var(--bg-left);
  padding: 28px 32px 40px;
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.logo {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  text-decoration: none;
  color: var(--fg);
  width: fit-content;
}

.logo svg { width: 46px; height: 46px; }

.logo span {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 1.6rem;
  letter-spacing: -.01em;
}

.hero {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 28px;
  text-align: center;
}

.hero h2 {
  font-family: var(--font-display);
  font-weight: 500;
  font-size: clamp(1.7rem, 2.8vw, 2.4rem);
  line-height: 1.25;
  max-width: 18ch;
  margin: 0;
}

.collage {
  width: min(100%, 360px);
  height: auto;
}

.right {
  background: var(--bg-right);
  border-left: 1px solid var(--line);
  padding: 32px 24px 24px;
  display: flex;
  flex-direction: column;
  align-items: center;
  min-width: 0;
}

.box {
  width: min(100%, 400px);
  margin-block: auto;
  padding-block: 16px;
}

.mobile-logo {
  display: none;
}

h1 {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 1.65rem;
  margin: 0 0 6px;
}

.lead {
  margin: 0 0 24px;
  color: var(--muted);
  font-size: .95rem;
}

form {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.field { position: relative; }

.field input {
  width: 100%;
  height: 58px;
  padding: 22px 18px 6px;
  font: inherit;
  color: var(--fg);
  background: transparent;
  border: 1px solid var(--line);
  border-radius: 24px;
  outline: none;
  transition: border-color .2s, box-shadow .2s;
}

.field input:focus {
  border-color: var(--pink);
  box-shadow: 0 0 0 3px rgba(255, 95, 162, .12);
}

.field label {
  position: absolute;
  left: 18px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--muted);
  font-size: .95rem;
  pointer-events: none;
  transition: top .15s, font-size .15s, transform .15s;
}

.field input:focus + label,
.field input:not(:placeholder-shown) + label {
  top: 13px;
  transform: none;
  font-size: .72rem;
}

.toggle {
  position: absolute;
  right: 10px;
  top: 50%;
  transform: translateY(-50%);
  font: inherit;
  font-size: .85rem;
  font-weight: 600;
  color: var(--pink-soft);
  background: transparent;
  border: 0;
  border-radius: 12px;
  padding: 8px 10px;
  cursor: pointer;
}

.password-input { padding-right: 90px !important; }

.submit {
  margin-top: 6px;
  min-height: 48px;
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 1.05rem;
  color: #fff;
  background: var(--pink-deep);
  border: 0;
  border-radius: 24px;
  cursor: pointer;
  transition: background .2s, transform .2s;
}

.submit:hover {
  background: #c62a72;
  transform: translateY(-1px);
}

.submit:disabled {
  background: var(--btn-off);
  color: #a58595;
  cursor: not-allowed;
  transform: none;
}

.hint {
  margin: 0;
  font-size: .85rem;
  color: var(--muted);
  min-height: 1.2em;
}

.hint.error { color: #ff7a98; }
.hint.success { color: #53d6a0; }

.or {
  display: flex;
  align-items: center;
  gap: 12px;
  color: var(--muted);
  font-size: .8rem;
  margin: 22px 0;
}

.or::before, .or::after {
  content: "";
  flex: 1;
  height: 1px;
  background: var(--line);
}

.btn-outline {
  display: grid;
  place-items: center;
  min-height: 46px;
  width: 100%;
  font-family: var(--font-display);
  font-weight: 500;
  font-size: 1rem;
  color: var(--pink-soft);
  background: transparent;
  border: 1px solid var(--pink);
  border-radius: 24px;
  text-decoration: none;
  transition: background .2s;
}

.btn-outline:hover {
  background: rgba(255, 95, 162, .1);
}

.note {
  margin: 18px 0 0;
  font-size: .78rem;
  color: var(--muted);
  text-align: center;
}

.footer {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  color: var(--muted);
  font-size: .85rem;
  padding-top: 16px;
}

.footer svg { width: 22px; height: 22px; }

.done {
  text-align: center;
}

.done[hidden], #formView[hidden] { display: none; }

.check {
  width: 72px;
  height: 72px;
  margin: 0 auto 14px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: rgba(255, 95, 162, .16);
}

.check svg { width: 34px; height: 34px; }

.done h2 {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 1.5rem;
  margin: 0 0 8px;
}

.done p {
  color: var(--muted);
  margin: 0 0 22px;
}

.done .submit { width: 100%; }

@media (max-width: 820px) {
  .page { grid-template-columns: minmax(0, 1fr); }
  .left { display: none; }

  .right {
    border-left: 0;
    padding: 24px 20px;
    min-height: 100vh;
  }

  .mobile-logo {
    display: flex;
    justify-content: center;
    margin-bottom: 24px;
  }

  .mobile-logo .logo svg {
    width: 54px;
    height: 54px;
  }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    transition-duration: .01ms !important;
  }
}
</style>
</head>

<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="gBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7fdcff"/>
      <stop offset="1" stop-color="#ff5fa2"/>
    </linearGradient>

    <symbol id="cam" viewBox="0 0 200 200">
      <rect x="14" y="14" width="172" height="172" rx="46" fill="url(#gBody)"/>
      <circle cx="152" cy="50" r="8" fill="#fff"/>
      <circle cx="100" cy="100" r="44" fill="none" stroke="#fff" stroke-width="12"/>
      <circle cx="100" cy="100" r="38" fill="#2b1233" opacity=".55"/>
      <ellipse cx="86" cy="86" rx="10" ry="6" fill="#fff" opacity=".8" transform="rotate(-35 86 86)"/>
    </symbol>
  </defs>
</svg>

<main class="page">

  <section class="left" aria-label="Presentación de lnst@gram">
    <a class="logo" href="/" aria-label="lnst@gram">
      <svg aria-hidden="true"><use href="#cam"/></svg>
      <span>lnst@gram</span>
    </a>

    <div class="hero">
      <h2>Guarda los momentos de tus mejores amigos.</h2>

      <svg class="collage" viewBox="0 0 340 250" role="img" aria-label="Ilustración de fotos y reacciones">
        <defs>
          <linearGradient id="gA" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#b66bff"/>
            <stop offset="1" stop-color="#ff5fa2"/>
          </linearGradient>
          <linearGradient id="gB" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ffb08a"/>
            <stop offset="1" stop-color="#ff4f9a"/>
          </linearGradient>
          <linearGradient id="gC" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ff8fc3"/>
            <stop offset="1" stop-color="#7b4dff"/>
          </linearGradient>
        </defs>

        <g transform="rotate(-7 86 142)">
          <rect x="38" y="62" width="96" height="160" rx="14" fill="url(#gA)"/>
          <circle cx="86" cy="116" r="22" fill="#fff" opacity=".25"/>
          <path d="M38 190 Q86 150 134 190 V208 A14 14 0 0 1 120 222 H52 A14 14 0 0 1 38 208 Z" fill="#fff" opacity=".18"/>
        </g>

        <g transform="rotate(6 256 146)">
          <rect x="208" y="70" width="96" height="152" rx="14" fill="url(#gC)"/>
          <circle cx="270" cy="112" r="16" fill="#fff" opacity=".28"/>
          <path d="M208 188 Q256 156 304 188 V208 A14 14 0 0 1 290 222 H222 A14 14 0 0 1 208 208 Z" fill="#fff" opacity=".18"/>
        </g>

        <rect x="104" y="20" width="136" height="214" rx="20" fill="url(#gB)"/>
        <rect x="116" y="40" width="112" height="4" rx="2" fill="#fff" opacity=".35"/>
        <rect x="116" y="40" width="48" height="4" rx="2" fill="#fff"/>
        <circle cx="172" cy="108" r="30" fill="#fff" opacity=".35"/>
        <path d="M104 182 Q150 132 196 178 T240 172 V214 A20 20 0 0 1 220 234 H124 A20 20 0 0 1 104 214 Z" fill="#fff" opacity=".22"/>
        <rect x="116" y="204" width="86" height="18" rx="9" fill="none" stroke="#fff" stroke-width="2"/>

        <rect x="96" y="4" width="74" height="26" rx="13" fill="#fff"/>
        <circle cx="116" cy="17" r="6" fill="#ff5fa2"/>
        <circle cx="134" cy="17" r="3" fill="#c9c9d0"/>
        <circle cx="144" cy="17" r="3" fill="#c9c9d0"/>
        <circle cx="154" cy="17" r="3" fill="#c9c9d0"/>

        <path transform="translate(24 138) scale(1.7)" d="M12 21s-7-4.6-9.3-9A5.3 5.3 0 0 1 12 6.2 5.3 5.3 0 0 1 21.3 12C19 16.4 12 21 12 21z" fill="#ff3d6e"/>

        <circle cx="282" cy="212" r="20" fill="#0a0c10" stroke="#ff5fa2" stroke-width="3"/>
        <circle cx="282" cy="212" r="14" fill="#ffd6e6"/>
        <circle cx="282" cy="208" r="5" fill="#ff5fa2"/>
        <path d="M272 222 Q282 212 292 222 Z" fill="#ff5fa2"/>
      </svg>
    </div>
  </section>

  <section class="right">
    <div class="box">

      <div class="mobile-logo">
        <a class="logo" href="/" aria-label="lnst@gram">
          <svg aria-hidden="true"><use href="#cam"/></svg>
          <span>lnst@gram</span>
        </a>
      </div>

      <div id="formView">
        <h1>Cambiar contraseña</h1>
        <p class="lead">Únete a lnst@gram y comparte tus momentos favoritos.</p>

        <form id="registerForm">
          <div class="field">
            <input id="email" name="email" type="email" autocomplete="email" placeholder=" " maxlength="254" required>
            <label for="email">Correo electrónico</label>
          </div>

          <div class="field">
            <input id="password" class="password-input" name="password" type="password" autocomplete="new-password" placeholder=" " minlength="8" required>
            <label for="password">Crea una contraseña nueva</label>
            <button type="button" class="toggle" data-target="password">Mostrar</button>
          </div>

          <div class="field">
            <input id="confirm" class="password-input" name="confirm" type="password" autocomplete="new-password" placeholder=" " minlength="8" required>
            <label for="confirm">Confirma tu contraseña nueva</label>
            <button type="button" class="toggle" data-target="confirm">Mostrar</button>
          </div>

          <p class="hint" id="registerMessage" role="status" aria-live="polite"></p>

          <button class="submit" id="submitBtn" type="submit">Confirmar</button>
        </form>

        <div class="or">o</div>

        <a class="btn-outline" href="/login.html">Ya tengo una cuenta</a>

        <p class="note"></p>
      </div>

      <div class="done" id="doneView" hidden>
        <div class="check">
          <svg viewBox="0 0 36 36" fill="none" aria-hidden="true">
            <path d="M7 19l8 8 14-16" stroke="#ff5fa2" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <h2>¡Bienvenido a lnst@gram</h2>
        <p>Tu cuenta se ha creado correctamente.</p>
        <button class="submit" id="again" type="button">Registrar otra cuenta</button>
      </div>

    </div>

    <div class="footer">
      <svg aria-hidden="true"><use href="#cam"/></svg>
      <span>© lnst@gram</span>
    </div>
  </section>

</main>

<script>
(function () {
  const form = document.getElementById("registerForm");
  const email = document.getElementById("email");
  const password = document.getElementById("password");
  const confirm = document.getElementById("confirm");
  const message = document.getElementById("registerMessage");
  const submitBtn = document.getElementById("submitBtn");

  document.querySelectorAll(".toggle").forEach(button => {
    button.addEventListener("click", () => {
      const input = document.getElementById(button.dataset.target);
      const mostrar = input.type === "password";
      input.type = mostrar ? "text" : "password";
      button.textContent = mostrar ? "Ocultar" : "Mostrar";
    });
  });

  form.addEventListener("submit", async event => {
    event.preventDefault();

    message.className = "hint";

    if (password.value !== confirm.value) {
      message.textContent = "Las contraseñas no coinciden.";
      message.classList.add("error");
      return;
    }

    if (password.value.length < 8) {
      message.textContent = "La contraseña debe tener al menos 8 caracteres.";
      message.classList.add("error");
      return;
    }

    submitBtn.disabled = true;
    message.textContent = "Creando tu cuenta...";

    try {
      const response = await fetch("/api/registrar", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          email: email.value.trim(),
          password: password.value
        })
      });

      const resultado = await response.json();

      if (!response.ok || !resultado.ok) {
        message.textContent = resultado.mensaje || "No se pudo crear la cuenta.";
        message.classList.add("error");
        return;
      }

      document.getElementById("formView").hidden = true;
      document.getElementById("doneView").hidden = false;
    } catch {
      message.textContent = "No se pudo conectar con el servidor. Comprueba que esté funcionando.";
      message.classList.add("error");
    } finally {
      submitBtn.disabled = false;
    }
  });

  document.getElementById("again").addEventListener("click", () => {
    form.reset();
    document.querySelectorAll(".toggle").forEach(button => {
      button.textContent = "Mostrar";
    });
    password.type = "password";
    confirm.type = "password";
    message.textContent = "";
    message.className = "hint";
    document.getElementById("doneView").hidden = true;
    document.getElementById("formView").hidden = false;
  });
})();
</script>

</body>
</html>
